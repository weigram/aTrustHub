name: build

# 推送与 PR 跑测试；打 v* 标签时为每个平台各出一个安装文件并发 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test:
    name: 测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: 打包 ${{ matrix.artifact }}
    # 只在打标签或手动触发时打包，普通推送跑测试就够。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal 一个包同时覆盖 Apple Silicon 与 Intel，产物是 .dmg。
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          # Windows 产物是 NSIS 安装包（atrusthub-setup-<版本>-amd64.exe）。
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 产物名带版本号，所以 mygo.json 的 version 要跟标签一致。
      - name: 同步版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/\"version\": \"$v\"/" mygo.json
          rm -f mygo.json.bak
          cat mygo.json

      - name: 编译 TUN 辅助程序
        shell: bash
        run: |
          cd third_party/zju-connect
          if [ "${{ matrix.platform }}" = "darwin/universal" ]; then
            GOOS=darwin GOARCH=arm64 go build -o /tmp/helper-arm64 ./cmd/multitun
            GOOS=darwin GOARCH=amd64 go build -o /tmp/helper-amd64 ./cmd/multitun
            lipo -create /tmp/helper-arm64 /tmp/helper-amd64 \
              -output ../../resources/zju-connect-multitun
          else
            GOOS=windows GOARCH=amd64 go build -o ../../resources/zju-connect-multitun.exe ./cmd/multitun
          fi
          ls -lh ../../resources/

      # mygo 在 Windows 上用它生成安装包，缺了会自动下载，这里先装好。
      - name: 安装 NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: 打包
        run: go tool mygo build -platform ${{ matrix.platform }}

      - name: 检查产物
        shell: bash
        run: |
          ls -lh build/*/ || true
          find build -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.deb' \) -print

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/**/*.dmg
            build/**/*-setup-*.exe
            build/**/*.tar.gz
            build/**/*.deb
            build/**/checksums.txt
          if-no-files-found: error
          compression-level: 0

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出产物
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*-setup-*.exe
            dist/**/*.tar.gz
            dist/**/*.deb
            dist/**/checksums.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
