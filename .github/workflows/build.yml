name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 单元测试
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go test ./...

  build:
    name: 打包 darwin-${{ matrix.arch }}
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 TUN 辅助程序
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOARCH: ${{ matrix.arch }}
        run: |
          cd third_party/zju-connect
          go build -o ../../resources/zju-connect-multitun ./cmd/multitun

      - name: 打包 .app
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOARCH: ${{ matrix.arch }}
        run: go tool mygo build -skip-dmg

      - name: 压缩为 zip
        run: |
          cd "build/darwin-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent aTrustHub.app \
            "aTrustHub-darwin-${{ matrix.arch }}.zip"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: aTrustHub-darwin-${{ matrix.arch }}
          path: build/darwin-${{ matrix.arch }}/aTrustHub-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
