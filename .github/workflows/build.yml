name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 单元测试
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go test ./...

  build:
    name: 打包 ${{ matrix.target }}
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-universal
            goos: darwin
            goarch: universal
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 清理旧辅助程序
        run: rm -f resources/zju-connect-multitun resources/zju-connect-multitun.exe

      - name: 编译 TUN 辅助程序（单架构）
        if: matrix.goarch != 'universal'
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd third_party/zju-connect
          go build -o "../../resources/zju-connect-multitun${{ matrix.ext }}" ./cmd/multitun

      - name: 编译 TUN 辅助程序（universal）
        if: matrix.goarch == 'universal'
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          cd third_party/zju-connect
          GOOS=darwin GOARCH=arm64 go build -o /tmp/helper-arm64 ./cmd/multitun
          GOOS=darwin GOARCH=amd64 go build -o /tmp/helper-amd64 ./cmd/multitun
          lipo -create /tmp/helper-arm64 /tmp/helper-amd64 \
            -output ../../resources/zju-connect-multitun
          file ../../resources/zju-connect-multitun

      - name: 打包应用
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go tool mygo build -platform "${{ matrix.goos }}/${{ matrix.goarch }}" -skip-dmg

      - name: 压缩 macOS .app
        if: matrix.goos == 'darwin'
        run: |
          cd "build/darwin-${{ matrix.goarch }}"
          ditto -c -k --sequesterRsrc --keepParent aTrustHub.app \
            "aTrustHub-darwin-${{ matrix.goarch }}.zip"
          ls -lh

      - name: 压缩 Windows 程序
        if: matrix.goos == 'windows'
        run: |
          cd "build/windows-${{ matrix.goarch }}"
          zip -q "aTrustHub-windows-${{ matrix.goarch }}.zip" \
            aTrustHub.exe "zju-connect-multitun${{ matrix.ext }}"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: aTrustHub-${{ matrix.target }}
          path: build/*/aTrustHub-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物
        run: |
          find dist -type f | sort
          du -sh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
